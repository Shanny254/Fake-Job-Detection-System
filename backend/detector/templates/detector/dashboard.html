<html>

</head>

<body style="background:#0B0F1A;color:white;font-family:Arial">

<div style="display:flex;gap:20px">

<div style="background:#1A2235;padding:20px;border-radius:8px">

</div>

<p>{{fake}}</p>
</div>

<div style="background:#1A2235;padding:20px;border-radius:8px">
<h2>Real Jobs</h2>
<p>{{real}}</p>
</div>

</div>

</body>
</html>
