<!DOCTYPE html>
<html>
<head>
<title>Analytics</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body style="background:#0B0F1A;color:white;font-family:Arial">

<h1>Fraud Analytics</h1>

<div style="width:500px">

<canvas id="fraudChart"></canvas>

</div>

<script>

const fakeJobs = {{fake}};
const realJobs = {{real}};

const ctx = document.getElementById('fraudChart');

new Chart(ctx, {

type: 'pie',

data: {

labels: ['Fake Jobs', 'Real Jobs'],

datasets: [{

data: [fakeJobs, realJobs],

backgroundColor: [
'#EF4444',
'#10B981'
]

}]

}

});

</script>

</body>
</html>
